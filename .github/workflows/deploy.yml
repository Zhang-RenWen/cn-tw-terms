name: 部署網站

# 產生詞彙頁與 sitemap.xml，再部署到 GitHub Pages。
# Pages 的 Source 要設成「GitHub Actions」。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read # deploy-pages 要讀取這個 run 上傳的網站檔案
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# 分成 build、deploy 兩個 job：同一個 job 裡上傳完馬上部署，偶爾會查不到剛上傳的網站檔案
# （"No artifacts named github-pages were found"）；deploy 等 build 結束才開始，就不會搶在前面
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/validate.mjs
      - run: node scripts/build-pages.mjs
      - run: mkdir _site && cp -r index.html style.css app.js config.js favicon.svg favicon-32.png apple-touch-icon.png og.png sitemap.xml data terms _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
