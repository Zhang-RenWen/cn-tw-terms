name: 檢查詞彙庫

on:
  pull_request:
    paths: ['data/**', 'scripts/**', '.github/workflows/**']
  push:
    branches: [main]
    paths: ['data/**', 'scripts/**', '.github/workflows/**']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/validate.mjs
