name: 檢查詞彙庫

on:
  pull_request:
    paths: ['data/**', 'scripts/**']
  push:
    branches: [main]
    paths: ['data/**', 'scripts/**']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/validate.mjs
